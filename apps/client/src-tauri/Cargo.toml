[package]
name = "moke"
version = "0.1.0"
description = "Moke Agent desktop client"
authors = ["Moke"]
edition = "2021"

[lib]
name = "moke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-decorum = "1.1.1"
url = "2"
png = "0.17.16"
base64 = "0.22"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.3"
