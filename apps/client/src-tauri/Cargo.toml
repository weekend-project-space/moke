[package]
name = "moke"
version = "0.1.0"
description = "Moke Agent desktop client"
authors = ["Moke"]
edition = "2021"

[lib]
name = "moke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
url = "2"
png = "0.17.16"
xcap = "0.3"
base64 = "0.22"
